name: Deploy @luisbedoia/coolprop-rs-wasm

# Publishes the npm package to GitHub Packages when a version tag is pushed
# (e.g. v0.1.0). The full CI runs first; the package is built from the exact
# wasm artifacts that passed it. The tag must match the Cargo workspace
# version (which CI keeps equal to wasm-pkg/package.json). Publishing uses
# the workflow's GITHUB_TOKEN; no extra secret is required.
on:
  push:
    tags:
      - "v*"

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # publish to GitHub Packages
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches the Cargo workspace version
        run: |
          cargo_version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          echo "tag: $GITHUB_REF_NAME, Cargo: $cargo_version"
          test "$GITHUB_REF_NAME" = "v$cargo_version"

      - uses: actions/download-artifact@v8
        with:
          name: wasm-dist
          path: wasm-pkg/dist/

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          scope: "@luisbedoia"

      - name: Install package dependencies
        working-directory: wasm-pkg
        run: npm ci

      # `prepack` compiles the TypeScript facade into lib/.
      - name: Publish to GitHub Packages
        working-directory: wasm-pkg
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
