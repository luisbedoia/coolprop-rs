[target.wasm32-unknown-emscripten]
runner = "node"
# rustc links through `emcc`, which since emscripten 4 links as C. CoolProp is
# C++: link as C++ so libc++/libc++abi and the JS exception runtime come in.
# Merged with (not replaced by) CARGO_TARGET_WASM32_UNKNOWN_EMSCRIPTEN_RUSTFLAGS.
rustflags = ["-C", "link-arg=-sDEFAULT_TO_CXX"]
