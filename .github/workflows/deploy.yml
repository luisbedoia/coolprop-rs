name: Deploy @luisbedoia/coolprop-rs-wasm

# Publishes the npm package to GitHub Packages when a v* tag is pushed (e.g. v0.1.0).
# The version is derived from the tag, the wasm artifacts are built in Docker
# (emscripten + Rust, mirroring `docker compose run --rm build-npm`), and the
# package is published to npm.pkg.github.com using the workflow's GITHUB_TOKEN —
# no extra secret is required.
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # publish to GitHub Packages
    steps:
      - name: Checkout (with CoolProp submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build wasm artifacts
        run: docker compose run --rm build-npm

      - name: Run browser test suite
        run: docker compose run --rm test-npm

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          scope: "@luisbedoia"

      - name: Set package version
        working-directory: wasm-pkg
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Publish to GitHub Packages
        working-directory: wasm-pkg
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
