name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Native target, straight on the runner. The toolchain (and its components)
  # comes from rust-toolchain.toml via the preinstalled rustup.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/cache@v6
        with:
          path: coolprop-sys/CoolProp/.cpm_cache
          key: cpm-${{ hashFiles('coolprop-sys/CoolProp/cmake/dependencies.cmake') }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  # wasm32-unknown-emscripten, inside the same image used locally.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/cache@v6
        with:
          path: coolprop-sys/CoolProp/.cpm_cache
          key: cpm-${{ hashFiles('coolprop-sys/CoolProp/cmake/dependencies.cmake') }}
      - run: docker compose run --rm test-wasm

  # Browser suite for the npm package (headless Chromium via Playwright).
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose run --rm test-npm
